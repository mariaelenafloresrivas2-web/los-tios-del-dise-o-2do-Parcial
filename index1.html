<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PRIMER PARCIAL</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <header>
        <div class="contenedor">
        <div class="encabezado">
            <h1>GRUPOS CONTABLES</h1>
        <div class="header">
        <span><b>UNIDAD:</b> 0252</span>
        <span class="derecha">Nivel Central</span>
    </div>

    <h2>GRUPO CONTABLE</h2>

    <div class="formulario">
        <label>Grupo:</label>
        <input type="text" id="campo-partida" value="">

        <label>Nombre:</label>
        <input type="text" id="campo-descrip" value="">

        <label>Vida útil:</label>
        <input type="text" id="campo-gestion" value="">

        <label>Observaciones:</label>
        <textarea id="campo-obs"></textarea>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>CÓDIGO</th>
                    <th><b>NOMBRE AUXILIAR</b></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="botones">
        <button onclick="nuevoGrupo()">Nuevo</button>
        <button onclick="modificar()">Modificar</button>
        <button class="btn" onclick="guardar()">Guardar</button>
        <button onclick="eliminar()">Eliminar</button>
        <button class="btn" onclick="deshacer()">Deshacer</button>
        <button onclick="salir()">Salir</button>
    </div>

</div>
    </header>

<div id="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; justify-content:center; align-items:center;">
    <div style="background:#f5f5f5; border:2px solid #999; width:320px; font-family:Arial,sans-serif;">
        <div id="modal-titulo" style="background:linear-gradient(#3c6f94,#2a5573); color:white; padding:8px 12px; font-weight:bold;"></div>
        <div id="modal-mensaje" style="padding:18px 15px; font-size:14px;"></div>
        <div id="modal-botones" style="text-align:center; padding:8px; border-top:1px solid #ccc;"></div>
    </div>
</div>

<script src="scrip1.js"></script>
</body>
</html>
