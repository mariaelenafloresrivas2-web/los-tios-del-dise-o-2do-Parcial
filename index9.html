<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seguridad</title>
    <link rel="stylesheet" href="style9.css">
</head>
<body>

<div class="contenedor">

    SEGURIDAD
</div>

    <div class="titulo-principal">SEGURIDAD</div>

    <div class="formulario">

        <div class="fila">

            <input type="text" value="admin" >

            <label class="espacio">CONTRASEÑA ASIGNADA:</label>
            <input type="password" value="12345" readonly>

        <div class="fila">

            <input type="text" value="administrador">
        </div>

        <div class="fila">

            <textarea></textarea>
        </div>

                <input type="radio" name="tipo"> Operador
                <input type="radio" name="tipo" checked> Administrador
            </div>
        </div>

    </div>

    <div class="botones">
        <button class="primero">Primero</button>
        <button class="anterior">Anterior</button>
        <button>Siguiente</button>
        <button>Último</button>
        <button>Nuevo</button>

        <button>Guardar</button>
        <button>Deshacer</button>
        <button class="salir">Salir</button>

</div>
